<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音助手</title>
  <script src="/static/vendor/vue.global.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .app {
      width: 420px;
      height: 700px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 18px; font-weight: 600; }
    .status { font-size: 12px; opacity: 0.9; }
    .status .dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 4px;
    }
    .status .ok { background: #4ade80; }
    .status .busy { background: #facc15; animation: pulse 1s infinite; }
    .status .err { background: #f87171; }
    @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.4} }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
    .msg.user { align-self: flex-end; background: #667eea; color: #fff; border-bottom-right-radius: 4px; }
    .msg.assistant { align-self: flex-start; background: #f1f5f9; color: #1e293b; border-bottom-left-radius: 4px; }
    .msg.system { align-self: center; background: #fef3c7; color: #92400e; font-size: 12px; }

    .tool-card {
      align-self: flex-start;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      color: #1e40af;
      max-width: 90%;
    }
    .tool-card .tool-name { font-weight: 600; }
    .tool-card .tool-args { color: #3b82f6; margin-top: 2px; }
    .tool-card .tool-result { color: #6b7280; margin-top: 4px; }

    .thinking {
      align-self: flex-start;
      color: #9ca3af;
      font-size: 12px;
      padding: 4px 8px;
    }
    .thinking::after { content: "…"; animation: dots 1.2s infinite; }
    @keyframes dots { 0%{content:""} 33%{content:"."} 66%{content:".."} 100%{content:"..."} }

    .input-bar {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5db;
      border-radius: 24px;
      font-size: 14px;
      outline: none;
    }
    .input-bar input:focus { border-color: #667eea; }
    .btn {
      width: 44px; height: 44px;
      border: none; border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: all 0.2s;
    }
    .btn-send { background: #667eea; color: #fff; }
    .btn-send:hover { background: #5a6fd6; }
    .btn-mic { background: #f3f4f6; color: #4b5563; }
    .btn-mic.recording { background: #ef4444; color: #fff; animation: pulse 1s infinite; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .mic-tip {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      padding: 4px;
      min-height: 18px;
    }
    .device-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 16px 0;
    }
    .device-select {
      flex: 1;
      max-width: 320px;
      padding: 6px 10px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 12px;
      color: #374151;
      background: #fff;
      outline: none;
    }
    .device-refresh {
      border: none;
      background: #f3f4f6;
      border-radius: 6px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 13px;
    }
    .clear-btn {
      background: none; border: none;
      color: rgba(255,255,255,0.8);
      font-size: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="app">
      <!-- 头部 -->
      <div class="header">
        <h1>🎙️ 语音助手</h1>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="status">
            <span class="dot" :class="status"></span>{{ statusText }}
          </div>
          <a class="clear-btn" href="/welcome" style="text-decoration:none;" target="_blank">欢迎页</a>
          <button class="clear-btn" @click="resetChat">重置</button>
        </div>
      </div>

      <!-- 消息区 -->
      <div class="messages">
        <template v-for="(m, i) in messages" :key="i">
          <div class="msg" :class="m.role">{{ m.content }}</div>
          <div v-for="(t, j) in m.tools" :key="j" class="tool-card">
            <div class="tool-name">🔧 {{ t.name }}</div>
            <div class="tool-args">参数: {{ JSON.stringify(t.arguments) }}</div>
            <div class="tool-result">{{ t.result }}</div>
          </div>
        </template>
      </div>

      <!-- 输入区 -->
      <div class="device-bar">
        <select v-model="selectedDevice" class="device-select" title="语音输入设备">
          <option v-for="d in micDevices" :key="d.deviceId" :value="d.deviceId">
            {{ d.label }}
          </option>
        </select>
        <button class="device-refresh" @click="refreshDevices" title="刷新设备">🔄</button>
      </div>
      <div class="mic-tip">{{ micTip }}</div>
      <div class="input-bar">
        <button class="btn btn-mic" :class="{ recording: isRecording }" @click="toggleRecord" :disabled="status === 'busy'">
          {{ isRecording ? '⏹' : '🎤' }}
        </button>
        <input
          v-model="input"
          @keyup.enter="sendText"
          placeholder="输入消息，回车发送..."
          :disabled="status === 'busy'"
        />
        <button class="btn btn-send" @click="sendText" :disabled="status === 'busy'">➤</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
